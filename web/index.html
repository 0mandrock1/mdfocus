<!DOCTYPE html>
<html lang="uk" data-accent="lime">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdfocus — читалка з токенами концентрації</title>
<link rel="stylesheet" href="https://files.mandrock.me/web/mandrock0-tokens.css">
<link rel="stylesheet" href="https://tools.mandrock.me/palettes/accents.css">
<script src="https://files.mandrock.me/web/mandrock0-ambient.js" data-profile="full" data-section="lime" data-seed="481027395" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<style>
  :root{
    --bg:var(--background); --text:var(--foreground); --sub:var(--muted-foreground); --accent:var(--page-accent);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  .wrap{max-width:680px; margin:0 auto;}
  h1.title{font-size:1.3rem; font-weight:700; margin:0 0 6px;}
  p.sub{color:var(--sub); margin:0 0 24px; font-size:.85rem;}

  /* --- top progress rail (section pacing) --- */
  #progress-rail{
    position:fixed; top:0; left:0; right:0; height:3px; z-index:50;
    background:var(--secondary);
  }
  #progress-fill{
    height:100%; width:0%; background:var(--accent);
    transition:width .25s ease;
  }

  /* --- source panel --- */
  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; margin-bottom:20px;
  }
  .panel h2{font-size:.8rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--sub); margin:0 0 12px;}
  .src-tabs{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .src-tab{
    font-family:inherit; font-size:.8rem; color:var(--sub); background:var(--secondary);
    border:1px solid var(--border); border-radius:8px; padding:.4em .9em; cursor:pointer;
  }
  .src-tab.active{color:var(--text); border-color:var(--accent);}
  .src-pane{display:none;}
  .src-pane.active{display:block;}
  textarea#paste-area{
    width:100%; min-height:140px; resize:vertical; background:var(--muted);
    border:1px solid var(--border); border-radius:8px; color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85rem; padding:10px 12px;
  }
  .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  input[type="text"], input[type="url"]{
    flex:1; min-width:200px; background:var(--muted); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-family:inherit; font-size:.85rem; padding:8px 12px;
  }
  button.btn{
    font-family:inherit; font-size:.82rem; color:var(--accent); background:transparent;
    border:1px solid var(--border); border-radius:8px; padding:.5em 1.1em; cursor:pointer;
  }
  button.btn:hover{border-color:var(--accent);}
  input[type="file"]{color:var(--sub); font-size:.85rem;}
  .status-line{font-size:.78rem; color:var(--sub); margin-top:8px; min-height:1.1em;}
  .status-line.error{color:var(--accent-purple, #f66);}

  /* --- article --- */
  article#article{display:none;}
  article#article.visible{display:block;}
  article#article h1, article#article h2, article#article h3{font-weight:700; line-height:1.3;}
  article#article p{line-height:1.65; font-size:1rem;}
  article#article{overflow-wrap:anywhere;}
  article#article img{max-width:100%; height:auto;}
  .mdfocus-section{display:flow-root;}
  .mdfocus-section[hidden]{display:none;}
  #article:focus,.mdfocus-section:focus,.mdfocus-section :is(h1,h2,h3,h4,h5,h6):focus{outline:none;}
  article#article pre{
    background:var(--muted); border:1px solid var(--border); border-radius:8px;
    padding:12px 14px; overflow-x:auto; font-size:.85rem;
  }
  article#article code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  article#article blockquote{
    margin:0; padding:2px 16px; border-left:3px solid var(--accent); color:var(--sub);
  }
  article#article a{color:var(--accent);}

  /* mdfocus:tables */
  article#article .table-wrap{
    overflow-x:auto; margin:1.2em 0; border:1px solid var(--border); border-radius:8px;
    -webkit-overflow-scrolling:touch;
  }
  article#article table{
    width:100%; border-collapse:collapse; font-size:.9rem; font-variant-numeric:tabular-nums;
  }
  article#article thead th{
    background:var(--secondary); color:var(--text); font-weight:700;
    text-align:left; padding:.55em .8em; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  article#article tbody td{
    padding:.5em .8em; border-top:1px solid var(--border);
    vertical-align:top; word-break:normal; overflow-wrap:normal;
  }
  article#article tbody tr:nth-child(even){background:color-mix(in oklch, var(--secondary) 35%, transparent);}
  /* scroll affordance: edge fade appears only on the side that has more content */
  article#article .table-wrap.can-scroll-r{
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);
            mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);
  }
  article#article .table-wrap.can-scroll-l{
    -webkit-mask-image:linear-gradient(to left,#000 calc(100% - 32px),transparent);
            mask-image:linear-gradient(to left,#000 calc(100% - 32px),transparent);
  }
  article#article .table-wrap.can-scroll-l.can-scroll-r{
    -webkit-mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent);
            mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent);
  }
  article#article table th[align="center"], article#article table td[align="center"]{text-align:center;}
  article#article table th[align="right"], article#article table td[align="right"]{text-align:right;}
  article#article table code{
    font-size:.85em; background:var(--muted); border-radius:4px; padding:.1em .35em;
    white-space:normal; word-break:normal; overflow-wrap:normal;
  }
  article#article.bionic-reading-on .bionic-prefix{font-weight:700; font-style:italic;}
  article#article.reading-lane{max-width:58ch; margin-inline:auto;}
  body.reading-wide .wrap{max-width:none;}
  canvas[data-mandrock0-ambient]{
    opacity:var(--ambient-focus-opacity, 1);
    transition:opacity .65s ease;
  }
  body.reader-quiet canvas[data-mandrock0-ambient]{display:none!important;}

  .mdfocus-sep{margin:2em 0 1.4em;}
  .mdfocus-sep hr{border:none; border-top:1px solid var(--border); margin:0;}

  .reset-row{margin-top:24px; text-align:center;}
  footer{margin-top:28px; text-align:center; color:var(--muted-foreground); font-size:.72rem;}

  /* --- passive attention tokens --- */

  article#article .line-active{
    position:relative; border-radius:4px;
    background-image:linear-gradient(
      color-mix(in oklch,var(--focus-accent,var(--accent-lime)) 24%,transparent),
      color-mix(in oklch,var(--focus-accent,var(--accent-lime)) 24%,transparent)
    );
    background-size:100% var(--focus-height);
    background-position:0 var(--focus-top);
    background-repeat:no-repeat;
  }
  article#article .line-active::before{
    content:""; position:absolute; left:-5px; top:var(--focus-top);
    width:4px; height:var(--focus-height);
    background:var(--focus-accent,var(--accent-lime));
    pointer-events:none;
  }
  .focus-grip{
    position:fixed; z-index:46; width:28px; height:48px; transform:translate(-100%,-50%);
    display:none; align-items:center; justify-content:center; touch-action:none;
    border:1px solid var(--focus-accent,var(--accent-lime)); border-radius:6px;
    color:var(--focus-accent,var(--accent-lime)); background:var(--card);
    font:700 18px/1 sans-serif; cursor:grab; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .focus-grip.visible{display:flex;}
  .focus-grip.dragging{cursor:grabbing;}
  .focus-grip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media print{article#article .line-active{background:none;} article#article .line-active::before{display:none;} .focus-grip{display:none!important;}}

  body.reader-open .wrap{padding-bottom:calc(var(--reader-dock-space, 156px) + 16px);}
  /* The dock keeps navigation visible while reading settings stay in a dialog. */
  #token-controls{
    position:fixed; left:50%; bottom:max(8px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:50; width:min(390px, calc(100vw - 24px));
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:5px 8px; font-size:.85rem; color:var(--text);
    display:none; gap:3px; flex-direction:column;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  #token-controls.visible{display:flex;}
  .reader-nav{display:grid; grid-template-columns:44px 1fr 44px; gap:4px;}
  #reader-location{color:var(--sub); font-variant-numeric:tabular-nums;}
  .reader-actions{display:flex; justify-content:space-between; gap:4px;}
  .reader-actions button{flex:1;}
  .reader-control{
    min-height:44px; min-width:44px; padding:5px 8px; font:inherit; color:inherit;
    background:transparent; border:1px solid transparent; border-radius:7px; cursor:pointer;
  }
  .reader-control:hover,.reader-control[aria-pressed="true"]{border-color:var(--accent);}
  .reader-control:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .reader-control:disabled{opacity:.45; cursor:default; border-color:transparent;}
  .reader-tools{display:flex; gap:4px;}
  .reader-tools button:not(#reader-speech-stop){flex:1;}
  .reader-checkpoint{color:var(--accent); border-color:var(--border);}
  #reader-drift,#reader-table-card{touch-action:pan-y pinch-zoom;}
  #reader-drift{touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  #reader-speech-stop{padding-inline:4px;}
  .reader-tool-hint{position:fixed; top:8px; left:50%; z-index:51; transform:translateX(-50%);
    width:max-content; max-width:calc(100vw - 24px); padding:8px 12px;
    color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:8px;
    font-size:.85rem; pointer-events:none;}
  #article.reader-pick{cursor:crosshair;}
  ::highlight(mdfocus-speech){background-color:color-mix(in oklch,var(--accent-cyan) 36%,transparent);}
  ::highlight(mdfocus-pin){text-decoration:underline; text-decoration-color:var(--accent-purple);}
  .reader-speech-block{outline:1px solid var(--accent-cyan);}
  .reader-pin-block{outline:1px solid var(--accent-purple);}
  article#article .reader-table-open{font-size:.84rem; color:var(--accent); border-color:var(--border);}
  .reader-table-tools{display:flex; justify-content:flex-end; margin-bottom:4px;}
  article#article .reader-table-tools + .table-wrap{margin-top:0;}
  #reader-table-card{margin:0; overflow-wrap:anywhere;}
  #reader-table-card > div{display:grid; gap:3px; padding:9px 4px; border-bottom:1px solid var(--border);}
  #reader-table-card dt{color:var(--sub); font-size:.82rem;}
  #reader-table-card dd{margin:0; white-space:pre-wrap;}
  .reader-table-nav{position:sticky; bottom:0; display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; gap:8px; background:var(--card); margin-top:8px;}
  @media (orientation:landscape) and (max-height:480px) and (min-width:620px){
    #token-controls.visible{display:grid; width:min(710px,calc(100vw - 24px)); grid-template-columns:1fr 1fr;}
  }
  .reader-dialog{
    width:min(460px, calc(100% - 24px)); max-height:min(38rem, calc(100% - 32px));
    padding:0 12px 12px; background:var(--card); color:var(--text);
    border:1px solid var(--border); border-radius:12px; overflow:auto;
  }
  .reader-dialog::backdrop{background:rgb(0 0 0 / 65%);}
  .reader-dialog header{position:sticky; top:0; display:flex; align-items:center;
    justify-content:space-between; gap:8px; background:var(--card); padding:4px 0; z-index:1;}
  .reader-dialog h2{font-size:1rem; margin:0;}
  .reader-dialog ol{margin:0; padding:0; list-style:none;}
  .reader-dialog li + li{margin-top:4px;}
  .reader-dialog li button{width:100%; text-align:left; overflow-wrap:anywhere;}
  .reader-dialog li button[aria-current="location"]{border-color:var(--accent); color:var(--accent);}
  .reader-dialog label{display:flex; align-items:center; min-height:44px; gap:8px; cursor:pointer;}
  .reader-dialog label[hidden]{display:none;}
  .reader-dialog select{font:inherit; color:inherit; background:var(--muted); border:1px solid var(--border); border-radius:6px; padding:6px;}
  .reader-dialog input[type="range"]{flex:1; min-width:0;}
  .reader-voice-rate:not([hidden]){display:flex; align-items:center; gap:8px;}
  #reader-voice-rate-value{min-width:4ch; text-align:right; font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion:reduce){
    canvas[data-mandrock0-ambient],#progress-fill{transition:none;}
  }
</style>

<body>
<div id="progress-rail" role="progressbar" aria-label="Позиція в тексті" aria-valuenow="0" hidden><div id="progress-fill"></div></div>
<div id="reader-tool-hint" class="reader-tool-hint" role="status" hidden></div>
<nav id="token-controls" aria-label="Керування читанням">
  <div class="reader-nav">
    <button type="button" class="reader-control" id="reader-prev" aria-label="Попередня частина">←</button>
    <button type="button" class="reader-control" id="reader-outline-open" aria-haspopup="dialog">Зміст <span id="reader-location"></span></button>
    <button type="button" class="reader-control" id="reader-next" aria-label="Наступна частина">→</button>
  </div>
  <div class="reader-actions">
    <button type="button" class="reader-control" id="reader-paced" aria-pressed="false">По частинах</button>
    <button type="button" class="reader-control" id="reader-settings-open" aria-haspopup="dialog">Налаштування</button>
  </div>
  <div class="reader-tools">
    <button type="button" class="reader-control" id="reader-pin" aria-pressed="false" title="Закріпити речення під час зміни ширини">Якір</button>
    <button type="button" class="reader-control" id="reader-drift" aria-pressed="false" aria-label="Прокрутка під пальцем. Утримуй, зсувай вправо для прискорення" title="Утримуй, зсувай вправо або вліво для зміни швидкості">↓ Пливти</button>
    <button type="button" class="reader-control" id="reader-speech" aria-pressed="false">Озвучити</button>
    <button type="button" class="reader-control" id="reader-speech-stop" aria-label="Зупинити озвучення" hidden>✕</button>
  </div>
  <button type="button" class="reader-control reader-checkpoint" id="reader-return" hidden>↶ Назад до читання</button>
  <button type="button" class="reader-control reader-checkpoint" id="tc-resume" hidden>↪ Продовжити читання</button>
</nav>
<dialog class="reader-dialog" id="reader-outline" aria-labelledby="reader-outline-title">
  <header><h2 id="reader-outline-title">Зміст</h2><button type="button" class="reader-control" data-close aria-label="Закрити зміст">✕</button></header>
  <ol id="reader-outline-list"></ol>
</dialog>
<dialog class="reader-dialog" id="reader-table" aria-labelledby="reader-table-title">
  <header><h2 id="reader-table-title">Картки рядків</h2><button type="button" class="reader-control" data-close aria-label="Закрити картки">✕</button></header>
  <dl id="reader-table-card"></dl>
  <div class="reader-table-nav">
    <button type="button" class="reader-control" id="reader-table-prev" aria-label="Попередній рядок">←</button>
    <output id="reader-table-count" aria-live="polite"></output>
    <button type="button" class="reader-control" id="reader-table-next" aria-label="Наступний рядок">→</button>
  </div>
</dialog>
<dialog class="reader-dialog" id="reader-settings" aria-labelledby="reader-settings-title">
  <header><h2 id="reader-settings-title">Налаштування читання</h2><button type="button" class="reader-control" data-close aria-label="Закрити налаштування">✕</button></header>
  <label><input type="checkbox" id="tc-line-focus" checked> Лінія фокусу</label>
  <label><input type="checkbox" id="tc-bionic"> Bionic reading</label>
  <label><input type="checkbox" id="tc-reading-lane"> Вузька колонка</label>
  <label><input type="checkbox" id="tc-reading-wide"> На всю ширину</label>
  <label><input type="checkbox" id="tc-quiet"> Прибрати фонову анімацію</label>
  <label id="reader-voice-setting">Мова озвучення
    <select id="reader-voice-language">
      <option value="auto">Автовибір</option>
      <option value="uk-UA">Українська</option>
      <option value="en-US">Англійська</option>
      <option value="ru-RU">Російська</option>
    </select>
  </label>
  <div class="reader-voice-rate" id="reader-voice-rate-setting">
    <label for="reader-voice-rate">Швидкість озвучення</label>
    <input type="range" id="reader-voice-rate" min="0.5" max="3" step="0.1" value="1">
    <span id="reader-voice-rate-value" aria-hidden="true">1×</span>
  </div>
  <label><input type="checkbox" id="tc-noise-on"> Шум</label>
  <label>Тип шуму
    <select id="tc-noise-type">
      <option value="brown">Коричневий</option>
      <option value="pink">Рожевий</option>
      <option value="white">Білий</option>
      <option value="violet">Фіолетовий</option>
    </select>
  </label>
  <label>Гучність <input type="range" id="tc-noise-volume" min="0" max="1" step="0.001" value="0.3"></label>
</dialog>
<div class="wrap">
  <h1 class="title">mdfocus</h1>
  <p class="sub">рідер сирого markdown — токени концентрації уваги, не LLM-токени</p>

  <div class="panel" id="source-panel">
    <h2>Джерело</h2>
    <div class="src-tabs">
      <button type="button" class="src-tab active" data-pane="pane-paste">Paste</button>
      <button type="button" class="src-tab" data-pane="pane-upload">Upload</button>
      <button type="button" class="src-tab" data-pane="pane-url">URL</button>
    </div>
    <div class="src-pane active" id="pane-paste">
      <textarea id="paste-area" placeholder="встав сирий markdown сюди…"></textarea>
      <div class="row"><button type="button" class="btn" id="paste-load-btn">Читати</button></div>
    </div>
    <div class="src-pane" id="pane-upload">
      <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain">
    </div>
    <div class="src-pane" id="pane-url">
      <div class="row">
        <input type="url" id="url-input" placeholder="https://example.com/README.md">
        <button type="button" class="btn" id="url-load-btn">Завантажити</button>
      </div>
    </div>
    <div class="status-line" id="status-line"></div>
  </div>

  <article id="article" tabindex="-1"></article>

  <div class="reset-row" id="reset-row" style="display:none;">
    <button type="button" class="btn" id="reset-btn">← нове джерело</button>
  </div>

  <footer>Налаштування й позиція читання зберігаються в цьому браузері.</footer>
</div>
